name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # Trigger on version tags like v1.0.0, v2.1.0, etc.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v2.8.0)"
        required: true
        type: string

permissions:
  contents: write # Required for creating GitHub releases

env:
  IMAGE_REF: patroklo838/comfyui-patroklo

jobs:
  build-and-push:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    outputs:
      release-version: ${{ steps.vars.outputs.release-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Clear space to remove unused folders
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set environment variables
        id: vars
        run: |
          # Determine version based on trigger type
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: use input version
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            # GitHub Release published event
            VERSION="${{ github.event.release.tag_name }}"
          else
            # Tag trigger: use tag name (remove refs/tags/ prefix)
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          # RELEASE_VERSION feeds the bake steps' TAG env below.
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV

          # Hand the release version to any downstream job.
          echo "release-version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push CUDA 13.0 image
        id: build-cuda13
        uses: docker/bake-action@v5
        env:
          TAG: ${{ env.RELEASE_VERSION }}
        with:
          push: true
          files: ./docker-bake.hcl
          targets: |
            cuda13

      - name: Extract image refs
        id: refs-cuda13
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build-cuda13.outputs.metadata }}

      - name: Clean up Docker build cache
        run: |
          docker builder prune -af --filter "until=1h"
          docker system prune -af --volumes

      - name: Build and push regular image
        id: build-regular
        uses: docker/bake-action@v5
        env:
          TAG: ${{ env.RELEASE_VERSION }}
        with:
          push: true
          files: ./docker-bake.hcl
          targets: |
            regular

      - name: Extract image refs
        id: refs-regular
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build-regular.outputs.metadata }}

      - name: Release Summary
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          echo "🚀 Build & push completed!"
          echo "Version: ${RELEASE_VERSION}"
          echo "Docker Images:"
          echo " - ${IMAGE_REF}:${RELEASE_VERSION}-cuda12.8 (CUDA 12.8)"
          echo " - ${IMAGE_REF}:cuda12.8"
          echo " - ${IMAGE_REF}:latest"
          echo " - ${IMAGE_REF}:${RELEASE_VERSION}-cuda13.0 (CUDA 13.0)"
          echo " - ${IMAGE_REF}:cuda13.0"
